<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sonhos & Encantos</title>

    <link rel="stylesheet" href="../estilo/style.css">

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
</head>

<body>

    <main class="app">

        <!-- Logo -->
        <section class="logo-area">

            <div class="simbolo">
                <span class="coroa">♕</span>

                <div class="logo-se">
                    SE
                </div>

                <span class="coracao logo-coracao">♡</span>
            </div>

            <h1>
                Sonhos &
                <span>Encantos</span>
            </h1>

            <p class="subtitulo">
                Decoração de festas e eventos
            </p>


        </header>


        <!-- Saudação -->
        <section class="boas-vindas">

            <h2>Olá! ♡</h2>

            <p>Que bom ter você por aqui!</p>

            <span>Escolha o tipo de serviço que você deseja:</span>

        </section>


        <!-- Serviços -->
        <section class="servicos">

            <!-- Decoração de festas infantis -->
            <button class="servico">
                <div class="icone">
                    <svg viewBox="0 0 24 24">
                        <circle cx="9" cy="9" r="4"></circle>
                        <circle cx="15" cy="7" r="3"></circle>
                        <path d="M5 14c1.5 2 4 3 7 3s5.5-1 7-3"></path>
                    </svg>
                </div>

                <span>Decoração de<br>festas infantis</span>

                <strong>›</strong>
            </button>


            <!-- Chá de bebê -->
            <button class="servico">
                <div class="icone">
                    <svg viewBox="0 0 24 24">
                        <path d="M6 7h12l-1 12H7L6 7z"></path>
                        <path d="M9 7c0-2 1-3 3-3s3 1 3 3"></path>
                        <path d="M10 13c1.5-1 2.5-1 4 0"></path>
                    </svg>
                </div>

                <span>Chá de bebê</span>

                <strong>›</strong>
            </button>


            <!-- 15 anos -->
            <button class="servico">
                <div class="icone">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 20s-7-4.2-7-9a3.5 3.5 0 0 1 7-1.5A3.5 3.5 0 0 1 19 11c0 4.8-7 9-7 9z"></path>
                    </svg>
                </div>

                <span>Decoração de<br>15 anos</span>

                <strong>›</strong>
            </button>


            <!-- Casamento -->
            <button class="servico">
                <div class="icone">
                    <svg viewBox="0 0 24 24">
                        <circle cx="9" cy="13" r="5"></circle>
                        <circle cx="15" cy="13" r="5"></circle>
                        <path d="M12 6l1.5 1.5L12 9l-1.5-1.5L12 6z"></path>
                    </svg>
                </div>

                <span>Casamentos</span>

                <strong>›</strong>
            </button>


            <!-- Aniversários -->
            <button class="servico">
                <div class="icone">
                    <svg viewBox="0 0 24 24">
                        <path d="M5 11h14v8H5z"></path>
                        <path d="M3 11h18"></path>
                        <path d="M12 11V6"></path>
                        <path d="M10 6h4"></path>
                        <path d="M9 15h6"></path>
                    </svg>
                </div>

                <span>Aniversários</span>

                <strong>›</strong>
            </button>


            <!-- Eventos corporativos -->
            <button class="servico">
                <div class="icone">
                    <svg viewBox="0 0 24 24">
                        <path d="M5 10h14l-2 9H7l-2-9z"></path>
                        <path d="M8 10V7h8v3"></path>
                        <path d="M12 12v3"></path>
                        <path d="M10.5 13.5h3"></path>
                    </svg>
                </div>

                <span>Eventos<br>corporativos</span>

                <strong>›</strong>
            </button>

        </section>


        <!-- Orçamento -->
        <button class="orcamento">

            <div class="icone">
                <svg viewBox="0 0 24 24">
                    <rect x="4" y="5" width="16" height="15" rx="2"></rect>
                    <path d="M8 3v4M16 3v4M4 9h16"></path>
                    <path d="M12 12l.7 1.4 1.5.2-1.1 1.1.3 1.5-1.4-.7-1.4.7.3-1.5-1.1-1.1 1.5-.2L12 12z"></path>
                </svg>
            </div>

            <span>Solicite um<br>Orçamento</span>

            <strong>›</strong>

        </button>


        <!-- Frase final -->
        <section class="mensagem">

            <p>
                Transformando<br>
                momentos em<br>
                grandes histórias
            </p>

            <span class="coracao">♡</span>

        </section>

    </main>

</body>
</html>
