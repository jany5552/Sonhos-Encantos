<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modelos de Ornamentação</title>

    <link rel="stylesheet" href="../estilo/style.css">

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
</head>

<body>

    <main class="tela">

        <!-- Barra superior -->
        <header class="topo">

            <button class="voltar" onclick="history.back()" aria-label="Voltar">
                ←
            </button>

        </header>


        <!-- Título -->
        <section class="titulo">

            <img src="../infantil/983830.png" alt="">

            <div class="detalhe">
                <span></span>
                ♡
                <span></span>
            </div>

        </section>


        <!-- Seleção -->
        <section class="selecao">

            <h3>Selecione seu modelo:</h3>


            <!-- Modelos -->
            <div class="modelos">


                <!-- Jardim Encantado -->
                <button class="modelo">

                    <div class="foto">
                        <img
                            src="../infantil/983831.png"
                            alt="Decoração Jardim Encantado"
                        >
                    </div>

                    

                </button>


                <!-- Princesa -->
                <button class="modelo">

                    <div class="foto">
                        <img
                            src="../infantil/983834.png"
                            alt="Decoração Princesa"
                        >
                    </div>

                    

                </button>


                <!-- Safari -->
                <button class="modelo">

                    <div class="foto">
                        <img
                            src="../infantil/983832.png"
                            alt="Decoração Safari"
                        >
                    </div>

                    

                </button>


                <!-- Luxo -->
                <button class="modelo">

                    <div class="foto">
                        <img
                            src="../infantil/983836.png"
                            alt="Decoração Luxo"
                        >
                    </div>

                    

                </button>


                <!-- Super Heróis -->
                <button class="modelo">

                    <div class="foto">
                        <img
                            src="../infantil/983833.png"
                            alt="Decoração Super Heróis"
                        >
                    </div>

                    

                </button>


                <!-- Flores -->
                <button class="modelo">

                    <div class="foto">
                        <img
                            src="../infantil/983835.png"
                            alt="Decoração Flores"
                        >
                    </div>

                    

                </button>

            </div>

        </section>


        <!-- Barra inferior -->
        <div class="barra-inferior"></div>

    </main>

</body>
</html>
