<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aniversário - Sonho e Encanto</title>

    <link rel="stylesheet" href="../estilo/style.css">

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <main class="tela">

        <!-- Barra superior -->
        <header class="topo">
            <button class="voltar" onclick="history.back()">←</button>
        </header>

        <!-- Cabeçalho -->
        <section class="cabecalho">

            <div class="titulo-box">

                <div class="detalhe esquerda">❧</div>

                <div>
                    <h1>Aniversário</h1>

                    <p>
                        Veja nossos modelos e deixe
                        seu dia ainda mais especial!
                    </p>

                    <span class="coracao">♡</span>
                </div>

                <div class="detalhe direita">❧</div>

            </div>

        </section>


        <!-- Modelos -->
        <section class="modelos">

            <h2>Selecione seu modelo:</h2>


            <div class="grid-modelos">

                <!-- Modelo 1 -->
                    <img src="../aniversário/982221.png" alt="">

                 

                </div>


                <!-- Modelo 2 -->
               <img src="../aniversário/982229.png" alt="">

                </div>


                <!-- Modelo 3 -->
                <img src="../aniversário/982237.png" alt="">
                </div>


                <!-- Modelo 4 -->
                <img src="../aniversário/982238.png" alt="">

                </div>


                <!-- Modelo 5 -->
               <img src="../aniversário/982265.png" alt="">

                </div>


                <!-- Modelo 6 -->
                <img src="../aniversário/982271.png" alt="">
                </div>

            </div>

        </section>

    </main>


    <script>
        function selecionarModelo(modelo) {
            alert("Você selecionou o modelo " + modelo + "!");
        }
    </script>

</body>
</html>
