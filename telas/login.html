<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sonhos & Encantos - Login</title>

    <!-- CSS separado -->
    <link rel="stylesheet" href="../estilo/style.css">
</head>

<body>

    <main class="tela">

        <!-- Logo -->
        <section class="logo-area">

            <div class="logo">
                <span class="logo-s">S</span>
                <span class="logo-e">E</span>
            </div>

            <div class="brand-name">
                <h1>Sonhos &</h1>
                <h2>Encantos</h2>
            </div>

            <p class="subtitle">
                Decoração de festas e eventos
            </p>

        </section>

        <!-- Formulário -->
        <form class="login-form">

            <!-- E-mail -->
            <div class="input-box">
                <span class="icon">👤</span>

                <input
                    type="email"
                    name="email"
                    placeholder="E-mail"
                    required
                >
            </div>

            <!-- Senha -->
            <div class="input-box">
                <span class="icon">🔒</span>

                <input
                    type="password"
                    name="senha"
                    placeholder="Senha"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    aria-label="Mostrar senha"
                >
                    ◉
                </button>
            </div>

            <!-- Esqueci minha senha -->
            <a href="#" class="forgot-password">
                Esqueceu sua senha?
            </a>

            <!-- Botão -->
            <button type="submit" class="login-button">
                ♡ Entrar →
            </button>

        </form>

    </main>

</body>

</html>
