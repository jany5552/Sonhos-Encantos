<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sonhos & Encantos - Login</title>

    <!-- CSS separado -->
    <link rel="stylesheet" href="../estilo/style.css">
</head>

<body>

    <main class="tela">

        <!-- Logo -->
        <section class="logo-area">

            <div class="simbolo">
                <span class="coroa">♕</span>

                <div class="logo-se">
                    SE
                </div>

                <span class="coracao logo-coracao">♡</span>
            </div>

            <h1>
                Sonhos &
                <span>Encantos</span>
            </h1>

            <p class="subtitulo">
                Decoração de festas e eventos
            </p>

        </section>

        <!-- Formulário -->
        <form class="login-form">

            <!-- E-mail -->
            <div class="input-box">
                <span class="icon">👤</span>

                <input
                    type="email"
                    name="email"
                    placeholder="E-mail"
                    required
                >
            </div>

            <!-- Senha -->
            <div class="input-box">
                <span class="icon">🔒</span>

                <input
                    type="password"
                    name="senha"
                    placeholder="Senha"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    aria-label="Mostrar senha"
                >
                    ◉
                </button>
            </div>

            <!-- Esqueci minha senha -->
            <a href="#" class="forgot-password">
                Esqueceu sua senha?
            </a>

            <!-- Botão -->
            <section class="area-botao">

            <a href="#" class="botao">
                <span class="coracao-botao">♡</span>
                Entrar
                <span class="seta">→</span>
            </a>

        </section>

        </form>

    </main>

</body>

</html>
