<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamento Finalizado | Sonho e Encanto</title>
    <link rel="stylesheet" href="../estilo/style.css">
</head>

<body class="pagina-finalizado">

    <main class="tela-finalizado">

        <a href="orcamento.html" class="but">
            <button class="voltar" onclick="voltarPagina()">↩</button>
        </a>

        <section class="conteudo-finalizado">

            <div class="icone-sucesso">
                <svg viewBox="0 0 180 180"
                     xmlns="http://www.w3.org/2000/svg"
                     aria-label="Orçamento confirmado"
                     role="img">

                    <circle cx="90" cy="90" r="82" fill="#F5DFFF"/>

                    <rect x="43" y="36" width="77" height="103"
                          rx="9" fill="none" stroke="#54217B"
                          stroke-width="5"
                          transform="rotate(-5 80 90)"/>

                    <path d="M59 60 L103 56 M60 78 L105 74
                             M61 96 L88 94 M62 113 L82 111"
                          stroke="#54217B" stroke-width="5"
                          stroke-linecap="round"/>

                    <circle cx="121" cy="119" r="31"
                            fill="#B86ED8" stroke="#54217B"
                            stroke-width="4"/>

                    <path d="M105 119 L117 131 L139 106"
                          fill="none" stroke="#FFFFFF"
                          stroke-width="6"
                          stroke-linecap="round"
                          stroke-linejoin="round"/>
                </svg>
            </div>

            <h1>Finalizado!</h1>

            <p class="mensagem-finalizado">
                Seu orçamento foi enviado com sucesso.
                Em breve nossa equipe entrará em contato
                com você!
            </p>

            <a href="index.html" class="botao-inicio">
                <svg viewBox="0 0 24 24"
                     aria-hidden="true"
                     xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 10.5 L12 3 L21 10.5
                             M5.5 9 V21 H18.5 V9
                             M9.5 21 V14 H14.5 V21"
                          fill="none" stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"/>
                </svg>

                <span>Voltar para o início</span>
            </a>

            <div class="detalhe-coracao" aria-hidden="true">
                <span></span>
                ♥
                <span></span>
            </div>

        </section>

    </main>

</body>
</html>
