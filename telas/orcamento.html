<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solicite seu Orçamento</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../estilo/style.css">
</head>

<body>

    <main class="tela orcamento-tela">

        

        <!-- =========================
             BOTÃO VOLTAR
        ========================== -->

        <a href="paginainicial.html" class="but">
            <button class="voltar" onclick="voltarPagina()">↩</button>
        </a>

        <!-- =========================
             BANNER
        ========================== -->

        <section class="banner">
          <section class="titulo-orcamento">
          <h1>Orçamento</h1>
</section>


        </section>


        <!-- =========================
             FORMULÁRIO
        ========================== -->

        <form
            class="formulario"
            id="formOrcamento">


            <!-- NOME -->

            <div class="campo">

                <span class="icone">♙</span>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Nome completo"
                    required>

            </div>


            <!-- TELEFONE -->

            <div class="campo">

                <span class="icone">♧</span>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="Telefone"
                    required>

            </div>


            <!-- E-MAIL -->

            <div class="campo">

                <span class="icone">✉</span>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="E-mail corporativo"
                    required>

            </div>


            <!-- DATA -->

            <div class="campo">

                <span class="icone">▣</span>

                <input
                    type="date"
                    id="data"
                    name="data"
                    required>

            </div>


           

</div>
<!-- BOTÃO SOLICITAR ORÇAMENTO -->


<a href="final.html" class="btn-orcamento">
    <p class="btn-text">Solicite seu orçamento</p>
</a>
